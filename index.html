<!--
Medical Education fixes
Paste this block near the end of the current index.html, immediately before </body>.
It is intentionally scoped to the Medical Education FR/EN pages.
-->

<style id="medical-education-requested-fixes-20260901">
/* 1) Video thumbnails: crop a few pixels and clip to clean rounded corners.
      This removes the small black corner wedges visible in the source thumbnails. */
:is(#videos-pedagogiques, #videos-pedagogiques-en) .video-placeholder {
  border-radius: 12px !important;
  overflow: hidden !important;
  background: #ffffff !important;
}

:is(#videos-pedagogiques, #videos-pedagogiques-en) .video-placeholder img {
  top: -4px !important;
  left: -4px !important;
  width: calc(100% + 8px) !important;
  height: calc(100% + 8px) !important;
  object-fit: cover !important;
  border-radius: 12px !important;
}

/* Keep the clickable layer clipped to the same rounded shape. */
:is(#videos-pedagogiques, #videos-pedagogiques-en) .video-placeholder > a {
  border-radius: 12px !important;
  overflow: hidden !important;
}

/* 2) Bottom Request Training CTA:
      much less vertical whitespace + approximately twice the former width. */
:is(#videos-pedagogiques, #videos-pedagogiques-en)
  > div[style*="text-align: center"][style*="padding: 48px 0"] {
  padding: 16px 0 22px !important;
}

:is(#videos-pedagogiques, #videos-pedagogiques-en)
  > div[style*="text-align: center"] > .btn-solid {
  width: min(540px, calc(100% - 40px)) !important;
  min-width: 0 !important;
  text-align: center !important;
}

/* Mobile: retain comfortable side gutters without adding vertical whitespace. */
@media (max-width: 640px) {
  :is(#videos-pedagogiques, #videos-pedagogiques-en)
    > div[style*="text-align: center"][style*="padding: 48px 0"] {
    padding: 14px 0 18px !important;
  }

  :is(#videos-pedagogiques, #videos-pedagogiques-en)
    > div[style*="text-align: center"] > .btn-solid {
    width: calc(100% - 40px) !important;
  }
}
</style>

<script id="awake-surgery-thumbnail-fix-20260901">
(function () {
  function restoreAwakeSurgeryThumbnail() {
    document
      .querySelectorAll('.video-placeholder[data-video-id="nFEluJ_dfo0"] img')
      .forEach(function (img) {
        /* The current HTML points to local awake-surgery thumbnail files.
           Use YouTube's thumbnail directly so the card never appears blank. */
        img.onerror = function () {
          if (!img.dataset.hqFallback) {
            img.dataset.hqFallback = "1";
            img.src = "https://img.youtube.com/vi/nFEluJ_dfo0/hqdefault.jpg";
          }
        };
        img.src = "https://img.youtube.com/vi/nFEluJ_dfo0/maxresdefault.jpg";
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", restoreAwakeSurgeryThumbnail);
  } else {
    restoreAwakeSurgeryThumbnail();
  }
})();
</script>
